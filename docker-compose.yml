services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: work-order-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      # Read from .env, which is not committed. Copy .env.example to .env and set your own value.
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env, see .env.example}
    ports:
      # Published on 14330 rather than 1433 on purpose. A developer machine with SQL Server already
      # installed is listening on 1433, and Windows lets both bind it, so the local instance wins the
      # connection and the container is silently unreachable.
      - "14330:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      # -C trusts the container's self-signed certificate, which is what TrustServerCertificate on
      # the client side is doing too.
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  mssql-data:
